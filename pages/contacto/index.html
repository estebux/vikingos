<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikingos | Contacto</title>
    <link rel="stylesheet" href="../../css/estilos.css">
</head>

<body>
    <header>
        <h1>Vikingos</h1>
        <nav>
            <a href="../../index.html">Inicio</a>
            <a href="../serie/index.html">Sobre la serie</a>
            <a href="../elenco/index.html">Elenco</a>
            <a href="../temporadas/index.html">Temporadas</a>
            <a href="../curiosidades/index.html">Curiosidades</a>
            <a href="index.html">Contacto</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Contacto</h2>
            <p>Si querés dejarnos un comentario sobre la serie Vikingos, completá el siguiente formulario.</p>
            <form action="#" method="post">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>
                <div>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email">
                </div>
                <div>
                    <label for="motivo">Motivo:</label>
                    <select id="motivo" name="motivo">
                        <option value="consulta">Consulta</option>
                        <option value="comentario">Comentario</option>
                        <option value="sugerencia">Sugerencia</option>
                    </select>
                </div>
                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="6"></textarea>
                </div>
                <button type="button">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Trabajo práctico - Programación Web I - Da Vinci - Esteban Joel Pardo</p>
        <p>Sitio sobre la serie Vikingos</p>
    </footer>
</body>

</html>
